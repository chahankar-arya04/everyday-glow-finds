<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EFE8"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DFCE"/>
      <stop offset="60%" stop-color="#DFCBB3"/>
      <stop offset="100%" stop-color="#CDAF8D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad3)"/>
  
  <!-- Subtle pedestal -->
  <ellipse cx="300" cy="495" rx="190" ry="24" fill="#E2DAD0" opacity="0.6"/>

  <!-- Kraft Standup Pouch -->
  <!-- Top heat seal line -->
  <rect x="200" y="160" width="200" height="24" rx="3" fill="#B39373"/>
  <line x1="200" y1="172" x2="400" y2="172" stroke="#8E6F52" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Pouch body -->
  <path d="M210 184 L180 430 C180 460 210 475 300 475 C390 475 420 460 420 430 L390 184 Z" fill="url(#pouchGrad)"/>

  <!-- Botanical Herb Sprig Drawing in center window -->
  <g transform="translate(300, 310)">
    <circle r="60" fill="#FFFFFF" opacity="0.9" stroke="#C5B095" stroke-width="1.5"/>
    <!-- Rosemary Stem -->
    <path d="M-5 40 Q 0 0 5 -40" stroke="#4A654C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M-1 20 Q -18 15 -25 5" stroke="#3A533C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M1 10 Q 18 5 25 -5" stroke="#3A533C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-1 -5 Q -16 -12 -22 -24" stroke="#4A654C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M2 -15 Q 16 -22 22 -34" stroke="#4A654C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M2 -35 Q 8 -45 5 -50" stroke="#3A533C" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pouch Label Top -->
  <rect x="220" y="205" width="160" height="38" rx="4" fill="#2E473B"/>
  <text x="300" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">NUTROVALLY</text>

  <!-- Product Title on Pouch -->
  <text x="300" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#263A30" text-anchor="middle">DRIED ROSEMARY</text>
  <text x="300" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#4D5F54" text-anchor="middle">Whole Leaves (Natural)</text>

  <!-- Weight Badge -->
  <rect x="270" y="432" width="60" height="22" rx="4" fill="#FFFFFF" stroke="#8E6F52" stroke-width="1"/>
  <text x="300" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#5C4530" text-anchor="middle">200 g</text>

  <!-- Category Pill -->
  <g transform="translate(390, 45)">
    <rect width="170" height="32" rx="16" fill="#425C47"/>
    <text x="85" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">NATURAL / DIY</text>
  </g>
</svg>
