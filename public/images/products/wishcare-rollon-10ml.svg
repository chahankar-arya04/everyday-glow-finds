<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F1ECE3"/>
    </linearGradient>
    <linearGradient id="rollonCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F9F1D0"/>
      <stop offset="100%" stop-color="#B08D25"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24332D"/>
      <stop offset="50%" stop-color="#344840"/>
      <stop offset="100%" stop-color="#1B2621"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Subtle pedestal -->
  <ellipse cx="300" cy="490" rx="170" ry="22" fill="#E2DAD0" opacity="0.6"/>

  <!-- Roll-on Cap (Metallic gold tall cap) -->
  <rect x="270" y="130" width="60" height="110" rx="6" fill="url(#rollonCap)"/>
  <rect x="268" y="235" width="64" height="8" rx="2" fill="#8A6800"/>

  <!-- Tube Body (Slim travel format) -->
  <path d="M272 245 C272 245 268 255 268 270 L268 440 C268 455 280 465 300 465 C320 465 332 455 332 440 L332 270 C332 255 328 245 328 245 Z" fill="url(#tubeGrad)"/>
  
  <!-- Glass reflection highlight -->
  <path d="M275 260 L275 440" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Slim label -->
  <rect x="273" y="270" width="54" height="155" rx="4" fill="#FFFDF8" stroke="#E6DEC9" stroke-width="1"/>

  <text x="300" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#2D4A3E" text-anchor="middle" letter-spacing="1">WISHCARE</text>
  <line x1="280" y1="305" x2="320" y2="305" stroke="#D4AF37" stroke-width="1"/>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#1C1C1C" text-anchor="middle">HAIR SERUM</text>
  <text x="300" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#4B6358" text-anchor="middle">ROLL-ON</text>

  <rect x="282" y="365" width="36" height="16" rx="2" fill="#EBF2ED"/>
  <text x="300" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#234E3E" text-anchor="middle">10 ml</text>

  <!-- Feature Badge -->
  <g transform="translate(380, 45)">
    <rect width="180" height="32" rx="16" fill="#4B6358"/>
    <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">COMPACT ROLL-ON</text>
  </g>
</svg>
